name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify token
        env:
          GIT_KOI_TOKEN: ${{ secrets.GIT_KOI_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GIT_KOI_TOKEN" ]]; then
            echo "::error::Create a repo secret named GIT_KOI_TOKEN with a classic PAT that has read:user scope."
            exit 1
          fi

      - uses: yalongwastaken/git-koi@main
        with:
          body: white
          output-dir: koi
          token: ${{ secrets.GIT_KOI_TOKEN }}

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
